name: Gerar lockfiles Alpha 9.2.1 (uma vez)

on:
  push:
    branches:
      - 'fix/alpha9-2-1-estabilidade-integridade'

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configurar Rust estável
        uses: dtolnay/rust-toolchain@stable
      - name: Gerar lockfiles reproduzíveis da resolução atual
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar package-lock.json" }
          }
          if (-not (Test-Path src-tauri/Cargo.lock)) {
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar Cargo.lock" }
          }
      - name: Gravar somente os dois lockfiles na branch experimental
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json src-tauri/Cargo.lock
          if (-not (git diff --cached --quiet)) {
            git commit -m "build(alpha9.2.1): lock npm and cargo dependency graphs"
            if ($LASTEXITCODE -ne 0) { throw "Falha ao commitar lockfiles" }
            git push origin HEAD:fix/alpha9-2-1-estabilidade-integridade
            if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar lockfiles na branch" }
          } else {
            Write-Host "Lockfiles já presentes; nenhuma alteração."
          }
