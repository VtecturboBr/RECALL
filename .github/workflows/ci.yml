name: Validar RECALL Windows

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela verificações de commits substituídos na mesma branch.
concurrency:
  group: recall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    name: Frontend e Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Instalar dependencias web
        run: npm install --no-audit --no-fund
      - name: Verificar Svelte e TypeScript
        run: npm run check
      - name: Configurar Python para testes de restauração
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar restauração SQLite offline
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Testar busca e organização de itens
        run: npm run test:unit
      - name: Compilar frontend
        run: npm run build
      - name: Verificar Rust/Tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Testes de unidade Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # Temporary audit step. Read-only output used to persist exact lockfiles
      # in the PR branch; removed after harvesting.
      - name: Emitir lockfiles para auditoria
        if: github.ref == 'refs/heads/fix/alpha9-2-1-integridade-estabilidade'
        shell: pwsh
        run: |
          @'
          import base64,pathlib
          files = {'npm':'package-lock.json','cargo':'src-tauri/Cargo.lock'}
          for label,filename in files.items():
              raw=pathlib.Path(filename).read_bytes()
              encoded=base64.b64encode(raw).decode('ascii')
              for i in range(0,len(encoded),1800):
                  print('LOCKDATA|' + label + '|' + str(i//1800) + '|' + encoded[i:i+1800])
          '@ | python -

